services:
  - type: web
    name: voyage-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voyage-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: voyage-db
    plan: free
    postgresMajorVersion: "16"
